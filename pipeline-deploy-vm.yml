apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ocpvirt-image-deploy
spec:
  params:
    - default: quay.io/kubealex/rhel-bootc-demo
      name: QCOW2_IMAGE_NAME
      type: string
      description: 'ContainerDisk Image name'
    - default: ocpvirt-qcow2
      name: QCOW2_IMAGE_TAG
      type: string
      description: 'ContainerDisk Image tag'
    - default: rhel-bootc-vm
      name: VM_NAME
      type: string
      description: 'VM Name'
    - default: 2
      name: VM_CPU
      type: string
      description: 'VM CPU Count'
    - default: 2Gi
      name: VM_MEMORY
      type: string
      description: 'VM Memory'
    - default: 20Gi
      name: VM_DISK_SIZE
      type: string
      description: 'VM Disk Size'
  tasks:
    - name: kubevirt-vm-deploy
      params:
        - name: QCOW2_IMAGE_NAME
          value: $(params.QCOW2_IMAGE_NAME)
        - name: QCOW2_IMAGE_TAG
          value: $(params.QCOW2_IMAGE_TAG)
        - name: script
          value: |
            cat <<EOF | kubectl apply -f -
            ---
            apiVersion: ocpvirt.io/v1
            kind: VirtualMachine
            metadata:
              labels:
                ocpvirt.io/vm: vm-bootc-ocpvirt
              name: $(params.VM_NAME)
            spec:
              dataVolumeTemplates:
              - metadata:
                  creationTimestamp: null
                  name: $(params.VM_NAME)-dv
                spec:
                  pvc:
                    accessModes:
                    - ReadWriteMany
                    resources:
                      requests:
                        storage: 20Gi
                    storageClassName: ocs-storagecluster-cephfs
                  source:
                    registry:
                      url: docker://$(params.QCOW2_IMAGE_NAME):$(params.QCOW2_IMAGE_TAG)
              running: true
              template:
                metadata:
                  labels:
                    ocpvirt.io/vm: $(params.VM_NAME)-ocpvirt
                spec:
                  domain:
                    devices:
                      disks:
                      - disk:
                          bus: virtio
                        name: datavolumedisk1
                    resources:
                      requests:
                        memory: $(params.VM_MEMORY)
                    firmware:
                      bootloader:
                        efi:
                          secureBoot: false
                    cpu:
                      cores: $(params.VM_CPU)
                  terminationGracePeriodSeconds: 0
                  volumes:
                  - dataVolume:
                      name: $(params.VM_NAME)-dv
                    name: datavolumedisk1
            EOF
      taskRef:
        kind: Task
        name: ocpvirt-vm-deploy
